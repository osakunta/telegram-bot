name: Pulumi
on:
  - pull_request
jobs:
  preview:
    name: Pulumi Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - run: pip install -r requirements.txt
      - uses: pulumi/actions@v6
        with:
          command: preview
          cloud-url: ${{ secrets.PULUMI_CLOUD_URL }}
